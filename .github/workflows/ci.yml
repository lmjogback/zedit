name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # gh workflow run CI --ref BRANCH

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-suffix: ${{ github.job }}
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Version, changelog and tag agree
        shell: python3 {0}
        run: |
          import os, re, sys, tomllib

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          with open("CHANGELOG.md") as f:
              m = re.search(r"^## (\d+\.\d+\.\d+)\b", f.read(), re.M)
          errors = []
          if not m:
              errors.append("no '## X.Y.Z' heading in CHANGELOG.md")
          elif m.group(1) != version:
              errors.append(f"pyproject.toml has {version}, latest CHANGELOG.md entry is {m.group(1)}")
          if os.environ.get("GITHUB_REF_TYPE") == "tag" and os.environ["GITHUB_REF_NAME"] != f"v{version}":
              errors.append(f"tag {os.environ['GITHUB_REF_NAME']} does not match pyproject.toml version {version}")
          for e in errors:
              print(f"::error::{e}")
          if errors:
              sys.exit(1)
          print(f"version {version} OK")

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-suffix: ${{ github.job }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  lowest:
    # The oldest dependency versions pyproject.toml allows (dnspython 2.4), which
    # the lockfile never tests. zedit uses private dnspython API (cli._Reader).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-suffix: ${{ github.job }}
          python-version: "3.10"
      - run: uv run --isolated --resolution lowest-direct pytest -v tests/test_logic.py

  test:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # ubuntu-latest moves to 26.04 between 2026-10-19 and 2026-11-19; try it
          # early. Remove when the move is done.
          - python: "3.13"
            os: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-suffix: ${{ github.job }}
          python-version: ${{ matrix.python }}
      - name: Install BIND for integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bind9 bind9-dnsutils
          # The Ubuntu AppArmor profile blocks named from reading test files in /tmp
          sudo ln -sf /etc/apparmor.d/usr.sbin.named /etc/apparmor.d/disable/ || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.named || true
          sudo systemctl stop named || true
      - run: uv run pytest -v -rs
        env:
          # BIND is installed above: a skipped integration test is a failure here
          ZEDIT_REQUIRE_INTEGRATION: "1"
